<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles & Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .board-wrapper {
      position: relative;
      width: 400px;
      margin: 0 auto 20px;
    }
    #board {
      width: 100%;
    }

    .settings-btn {
      position: absolute;
      top: 0;
      right: -50px;
      background: none;
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .settings-btn:hover {
      background-color: #f0f0f0;
    }
    #settings-modal {
      display: none;
      position: fixed;
      top:50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 8px;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: left;
      min-width: 250px;
    }
    #settings-modal h3 {
      margin-top: 0;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .setting-item {
      margin: 10px 0;
    }

    #promotion-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 8px;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
    }
    #promotion-modal h3 {
      margin-top: 0;
      font-size: 16px;
    }
    #promotion-choices {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .promotion-choice {
      width: 60px;
      height: 60px;
      padding: 4px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f8f8f8;
    }
    .promotion-choice:hover {
      background-color: #e0e0e0;
    }
    .promotion-choice img {
      width: 100%;
      height: 100%;
    }

    #status {
      font-size: 18px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }
    #moves {
      max-width: 420px;
      margin: 20px auto;
      text-align: left;
      font-size: 14px;
      background: #f8f8f8;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-y: auto;
      max-height: 200px;
    }
    .move-entry {
      display: inline-block;
      margin-right: 10px;
      cursor: pointer;
    }
    .move-entry.active {
      background: #f6f669;
      border-radius: 3px;
      padding: 2px 4px;
    }
    .square-55d63 {
      position: relative;
    }
    .square-55d63 img {
      object-fit: contain;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
    }
    #arrow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .check-danger {
      background-color: #ff4d4d !important;
      box-shadow: inset 0 0 10px 5px rgba(0,0,0,0.5);
    }
  </style>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
</head>
<body>
  <h1>Chess</h1>

  <div class="modal-backdrop" id="modal-backdrop" onclick="closeSettings()"></div>
  <div id="settings-modal">
    <h3>Settings</h3>
    <div class="setting-item">
      <label>
        <input type="checkbox" id="check-alarm-toggle" onchange="toggleCheckAlarm()">
        Check Alert
      </label>
    </div>
    <div style="text-align: right; margin-top: 15px;">
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>

  <div class="modal-backdrop" id="promotion-backdrop" onclick="cancelPromotion()"></div>
  <div id="promotion-modal">
    <h3>승진할 기물을 선택하세요</h3>
    <div id="promotion-choices"></div>
    <div style="text-align: right; margin-top: 15px;">
      <button type="button" onclick="cancelPromotion()">Cancel</button>
    </div>
  </div>

  <div class="board-wrapper">
    <div id="board"></div>
    <svg id="arrow-overlay">
      <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6" fill="gold" />
        </marker>
      </defs>
    </svg>
    <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </div>

  <div id="status"></div>
  <div id="opening-name"></div>
  <button onclick="restartGame()">Restart</button>
  <button onclick="undoMove()">Undo</button>
  <div id="moves"></div>

<script>

  const game = new Chess();
  let board = null;

  let historyStates = [game.fen()];
  let currentPly = 0;

  let selectedSquare = null;
  let possibleMoves = [];
  let pendingPromotion = null; // { from, to }

  let openings = [];

  let isCheckAlarmEnabled = false;

  function isLive() {
    return currentPly === historyStates.length - 1;
  }

  function getDisplayGame() {
    return isLive() ? game : new Chess(historyStates[currentPly]);
  }

  function openSettings(){
    $('#modal-backdrop').show();
    $('#settings-modal').show();
  }
  function closeSettings() {
    $('#modal-backdrop').hide();
    $('#settings-modal').hide();
  }
  function toggleCheckAlarm() {
    isCheckAlarmEnabled = document.getElementById('check-alarm-toggle').checked;
    updateStatus();
  }

  function showPromotionModal() {
    $('#promotion-backdrop').show();
    $('#promotion-modal').show();
  }
  function hidePromotionModal() {
    $('#promotion-backdrop').hide();
    $('#promotion-modal').hide();
  }

  function openPromotionPicker(color, from, to) {
    pendingPromotion = { from, to };
    const pieces = ['q', 'r', 'b', 'n'];
    const $choices = $('#promotion-choices').empty();
    pieces.forEach(p => {
      const $btn = $('<button type="button" class="promotion-choice"></button>')
        .append($('<img>').attr('src', `img/${color}${p.toUpperCase()}.svg`).attr('alt', p))
        .on('click', () => resolvePromotion(p));
      $choices.append($btn);
    });
    showPromotionModal();
  }

  function resolvePromotion(piece) {
    if (!pendingPromotion) return;
    const { from, to } = pendingPromotion;
    pendingPromotion = null;
    hidePromotionModal();

    const move = game.move({ from, to, promotion: piece });
    board.position(game.fen(), false);
    if (move === null) return;
    recordMove();
  }

  function cancelPromotion() {
    if (!pendingPromotion) return;
    pendingPromotion = null;
    hidePromotionModal();
    board.position(game.fen(), false);
  }

  function clearVisuals() {
    $('#board .square-55d63').removeClass('check-danger');
    const overlay = document.getElementById('arrow-overlay');
    const paths = overlay.querySelectorAll('path');
    paths.forEach(p => p.remove());
  }
  function drawArrow(fromSquare, toSquare) {
    const $board = $('#board');
    const boardPos = $board.offset();

    const $from = $(`#board .square-${fromSquare}`);
    const $to = $(`#board .square-${toSquare}`);

    if ($from.length === 0 || $to.length === 0) return;

    const fromPos = $from.offset();
    const toPos = $to.offset();
    const squareWidth = $from.width();
    const squareHeight = $from.height();

    const x1 = fromPos.left - boardPos.left + squareWidth / 2;
    const y1 = fromPos.top - boardPos.top + squareHeight / 2;
    const x2 = toPos.left - boardPos.left + squareWidth / 2;
    const y2 = toPos.top - boardPos.top + squareHeight / 2;

    const ns = "http://www.w3.org/2000/svg";
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M${x1},${y1} L${x2},${y2}`);
    path.setAttribute('stroke', 'gold');
    path.setAttribute('stroke-width', '8');
    path.setAttribute('stroke-opacity', '0.8');
    path.setAttribute('marker-end', 'url(#arrowhead)');
    path.setAttribute('fill', 'none');

    document.getElementById('arrow-overlay').appendChild(path);
  }

  function visualizeCheck(sourceGame) {
    clearVisuals();
    if (!sourceGame.in_check()) return;

    const turn = sourceGame.turn();
    const boardState = sourceGame.board();
    let kingSquare = null;

    for (let r = 0; r < 8 && !kingSquare; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = boardState[r][c];
        if (piece && piece.type === 'k' && piece.color === turn) {
          // 행/열 인덱스를 대수기호(e.g., e1)로 변환
          const file = String.fromCharCode('a'.charCodeAt(0) + c);
          const rank = 8 - r;
          kingSquare = file + rank;
          break;
        }
      }
    }

    if (!kingSquare) return;

    $(`#board .square-${kingSquare}`).addClass('check-danger');

    const opponentColor = turn === 'w' ? 'b' : 'w';
    const squares = ['a','b','c','d','e','f','g','h'];

    const fenParts = sourceGame.fen().split(' ');
    fenParts[1] = opponentColor;
    const probe = new Chess(fenParts.join(' '));

    for (let r = 1; r <= 8; r++) {
      for (const f of squares) {
        const sq = f + r;
        const piece = probe.get(sq);

        if (piece && piece.color === opponentColor) {
          const moves = probe.moves({ square: sq, verbose: true, legal: false });
          const attacksKing = moves.some(m => m.to === kingSquare);

          if (attacksKing) {
            drawArrow(sq, kingSquare);
          }
        }
      }
    }
  }


  fetch('openings.json')
    .then(response => response.json())
    .then(data => { openings = data; })
    .catch(err => { console.error('Failed to load openings.json', err); });

  function recordMove() {
    historyStates.push(game.fen());
    currentPly = historyStates.length - 1;
    updateStatus();
    renderMoveHistory();
  }

  function onDragStart(source, piece, position, orientation) {
    if (!isLive()) return false;
  }

  function onDrop(source, target, piece) {
    if (source === target) return 'snapback';

    const legalMoves = game.moves({ square: source, verbose: true });
    const candidate = legalMoves.find(m => m.to === target);
    if (!candidate) return 'snapback';

    if (candidate.promotion) {
      openPromotionPicker(piece[0], source, target);
      return;
    }

    const move = game.move({ from: source, to: target });
    if (move === null) return 'snapback';
    recordMove();
  }

  function onSnapEnd() {
    if (pendingPromotion) return;
    board.position(game.fen());
  }

  function updateStatus() {
    const displayGame = getDisplayGame();
    let status = '';
    const moveColor = displayGame.turn() === 'w' ? 'White' : 'Black';

    if (displayGame.in_checkmate()) {
      status = `Game over - ${moveColor} is in checkmate.`;
    } else if (displayGame.in_draw()) {
      status = 'Draw.';
    } else if (displayGame.in_check()) {
      status = `${moveColor} is in check.`;
    } else {
      status = '';
    }

    function detectOpening(history) {
      let matched = '';
      let maxLength = 0;
      for (const opening of openings) {
        if (history.length < opening.moves.length) continue;
        const match = opening.moves.every((move, i) => move === history[i]);
        if (match && opening.moves.length > maxLength) {
          matched = opening.name;
          maxLength = opening.moves.length;
        }
      }
      return matched;
    }

    const displayHistory = game.history().slice(0, currentPly);
    const currentOpening = detectOpening(displayHistory);
    document.getElementById('status').innerText = status;
    document.getElementById('opening-name').innerText =
      currentOpening ? `${currentOpening}` : '';

    if (isCheckAlarmEnabled) {
      visualizeCheck(displayGame);
    }
    else {
      clearVisuals();
    }
  }

  function viewPly(ply) {
    if (ply === currentPly) return;
    currentPly = ply;
    board.position(historyStates[currentPly], false);
    selectedSquare = null;
    possibleMoves = [];
    removeHighlights();
    updateStatus();
    renderMoveHistory();
  }

  function renderMoveHistory() {
    const history = game.history({ verbose: true });
    const container = document.getElementById('moves');
    container.innerHTML = '';

    for (let i = 0; i < history.length; i += 2) {
      const moveNumber = Math.floor(i / 2) + 1;
      const span = document.createElement('span');
      span.className = 'move-entry';
      let text = `${moveNumber}. ${history[i].san}`;
      if (i + 1 < history.length) text += ` ${history[i + 1].san}`;
      span.innerText = text;

      const targetPly = (i + 1 < history.length) ? i + 2 : i + 1;
      if (targetPly === currentPly) span.classList.add('active');

      span.onclick = () => viewPly(targetPly);

      container.appendChild(span);
    }
  }

  function restartGame() {
    game.reset();
    board.start();
    historyStates = [game.fen()];
    currentPly = 0;
    selectedSquare = null;
    possibleMoves = [];
    pendingPromotion = null;
    hidePromotionModal();
    updateStatus();
    renderMoveHistory();
  }

  function undoMove() {
    const move = game.undo();
    if (!move) return;
    historyStates.pop();
    currentPly = historyStates.length - 1;
    board.position(game.fen(), false);
    updateStatus();
    renderMoveHistory();
  }

  function onSquareClick(square) {
    if (!isLive()) return; 

    // reselect, cancel
    if (selectedSquare === square) {
      selectedSquare = null;
      removeHighlights();
      return;
    }

    // not selected
    if (!selectedSquare) {
      const moves = game.moves({ square, verbose: true });
      if (moves.length === 0) return;

      selectedSquare = square;
      possibleMoves = moves.map(m => m.to);

      highlightSquare(square);
      highlightMoves(possibleMoves);
      return;
    }

    const legalMoves = game.moves({ square: selectedSquare, verbose: true });
    const candidate = legalMoves.find(m => m.to === square);
    const from = selectedSquare;

    // reset state
    selectedSquare = null;
    possibleMoves = [];
    removeHighlights();

    if (!candidate) return;

    if (candidate.promotion) {
      const piece = game.get(from);
      openPromotionPicker(piece.color, from, square);
      return;
    }

    const move = game.move({ from, to: square });
    if (move) {
      board.position(game.fen(), true); // animated
      recordMove();
    }
  }

  function highlightSquare(square) {
    $(`#board .square-${square}`).css('background', '#f6f669');
  }

  function highlightMoves(moves) {
    moves.forEach(sq => {
      $(`#board .square-${sq}`).css('background', '#a9a9a9');
    });
  }

  function removeHighlights() {
    $('#board .square-55d63').css('background', '');
  }

  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    pieceTheme: 'img/{piece}.svg'
  });

  $('#board').on('click', '.square-55d63', function () {
    onSquareClick($(this).data('square'));
  });

  updateStatus();
</script>

</body>
</html>
